vo=gpu
gpu-context=wayland
hwdec=vaapi
hwdec-codecs=h264,mpeg2video,vc1
vaapi-device=/dev/dri/renderD129
profile=fast
ytdl-format=bestvideo[height<=1080][fps<=30][vcodec^=avc]+bestaudio/bestvideo[height<=1080][fps<=30][vcodec^=avc]/best[height<=1080]/best
scale=bilinear
cscale=bilinear
dscale=bilinear
scaler-resizes-only=yes
deband=no
video-sync=audio
framedrop=vo
vd-lavc-threads=4
demuxer-max-bytes=64MiB
demuxer-max-back-bytes=32MiB
cache-pause=no

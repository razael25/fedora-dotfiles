# Idle and lock via Noctalia lockscreen.
# Ini menimpa berkas bawaan Fedora /usr/share/sway/config.d/90-swayidle.conf
# (mekanisme layered-include: nama berkas sama di config.d user menang).
# Semua jalur kunci (idle, sleep, logind Lock) ke Noctalia agar tidak
# menumpuk dengan swaylock.
#
# Requires: swayidle
# Requires: noctalia

exec LT="$lock_timeout" ST="$screen_timeout" LT=${LT:-300} ST=${ST:-60} && \
    swayidle -w \
        timeout $LT 'noctalia msg session lock' \
        timeout $((LT + ST)) 'swaymsg "output * power off"' \
                      resume 'swaymsg "output * power on"' \
        before-sleep 'noctalia msg session lock' \
        lock 'noctalia msg session lock'

# Lock saat lid laptop ditutup (handle sebelum logind suspend).
bindswitch --reload --locked lid:on exec noctalia msg session lock

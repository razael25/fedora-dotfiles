# SwayFX eye-candy ringan-menengah (i5-4210U / HD 4400 / RAM 12GB).
# Radius dikunci sesuai selera user. Backup: 16-fx.conf.bak-*
corner_radius 6
smart_corner_radius enable
shadows enable
shadow_blur_radius 15
shadow_color #000000AA
for_window [all] dim_inactive 0.15
blur enable
blur_passes 2
blur_radius 5
animation_duration_ms 250

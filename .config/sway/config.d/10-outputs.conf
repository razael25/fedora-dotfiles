# Auto display: eDP-1 mati hanya saat HDMI-A-1 tercolok (via kanshi).
# Profil diterapkan ulang otomatis 3 detik setelah login (lihat bawah).
exec kanshi
# Terapkan ulang profil kanshi 10 detik setelah tiap reload:
# reload me-reset output ke default (disable eDP-1 dari kanshi hilang),
# jadi profil harus dipasang ulang. Jeda 10 detik (bukan 3) agar transaksi
# output milik reload selesai dulu — transaksi ganda yang bertumpuk di
# driver nouveau yang sakit = segfault (riwayat crash 19:08 & 19:11).
exec_always sleep 10 && kanshictl reload

# Warna dasar root sewarna tema (Gruvbox dark) agar flash saat boot/ganti
# resolusi tidak abu-abu. Wallpaper tetap dipegang Noctalia di atasnya.
# DIMATIKAN: swaybg solid menutupi wallpaper Noctalia (laporan: wallpaper polos).

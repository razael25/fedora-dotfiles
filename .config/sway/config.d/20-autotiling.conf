# Autotiling: otomatis pilih splith/splitv ikut rasio window.
# Manual tetap bisa: Super+b (horizontal), Super+v (vertical), Super+e (toggle).
# Wrapper single-instance (bunuh duplikat -> jeda -> start).
# Pola di dalam wrapper hanya cocok proses target, jadi aman dari self-kill.
exec_always $HOME/.local/bin/autotiling-once
